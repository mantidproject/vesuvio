name: Run tests nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'
  push:
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: github.repository_owner == 'mantidproject'
    strategy:
      max-parallel: 1
      matrix:
        os:
          - windows-latest
          - ubuntu-22.04  
    runs-on: ${{ matrix.os }} 

    steps:
      - name: Checkout mvesuvio
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Run all tests
        uses: ./.github/actions/run-all-tests
        with:
          token: ${{ secrets.COVERALLS_REPO_TOKEN }}
