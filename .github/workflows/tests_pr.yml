name: Run tests on PR

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # Set up pixi environment
      - name: Setup Pixi
        uses: prefix-dev/setup-pixi@v0

      - name: Check for files changed 
        run: |
          if [[ "${{ github.event.action }}" == "opened" ]]; then
            echo "files-changed=true" >> "$GITHUB_ENV"
          else
            echo "files-changed=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -q -e '^src/' -e '^tests/' && echo true || echo false)" >> $GITHUB_ENV
          fi

      - name: Run mvesuvio Analysis Unit Tests
        if: ${{ env.files-changed == 'true'}}
        run: pixi run -e vesuvio-developer test-analysis-unit

      - name: Run mvesuvio Analysis System Tests
        if: ${{ env.files-changed == 'true'}}
        run: pixi run -e vesuvio-developer test-analysis-system

      - name: Run mvesuvio Calibration Unit Tests
        if: ${{ env.files-changed == 'true'}}
        run: pixi run -e vesuvio-developer test-calibration-unit

      - name: Run Vesuvio Calibration System Tests
        if: ${{ env.files-changed == 'true'}}
        run: pixi run -e vesuvio-developer test-calibration-system
